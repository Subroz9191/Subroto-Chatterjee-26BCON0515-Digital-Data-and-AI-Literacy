  <rect x="20" y="20" width="560" height="360" rx="12" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="28" y="28" width="544" height="344" rx="8" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

